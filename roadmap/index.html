<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roadmap</title>
<meta name="description" content="Every topic, section and item with its resource, second source and note, in one searchable page.">
<style>
:root{
  --bg:#ffffff; --surface:#f5f5f3; --ink:#1d1d1f; --muted:#6e6e73; --rule:#e5e5e2;
  --accent:#2457c5; --signal:#b8431f; --done:#2f7d4f;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141414; --surface:#1e1e1e; --ink:#e8e8e6; --muted:#9a9a97; --rule:#2c2c2c;
  --accent:#8ab4f8; --signal:#f28b6b; --done:#6fcf97;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 120px}

/* header */
.mast{padding:40px 0 8px}
.crumb{font-size:15px;color:var(--muted)}
h1{font-size:2rem;font-weight:700;letter-spacing:-.02em;margin:16px 0 20px;line-height:1.2}
.bars{display:flex;flex-wrap:wrap;gap:12px 32px}
.bar{flex:1 1 240px}
.bar .lab{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.bar .lab b{color:var(--ink);font-weight:600}
.track-bar{height:4px;background:var(--rule);border-radius:99px;overflow:hidden}
.track-bar i{display:block;height:100%;background:var(--ink)}

.controls{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 0 12px;
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.controls input[type=search]{flex:1 1 100%;font:inherit;padding:9px 12px;border:1px solid var(--rule);
  background:var(--bg);color:var(--ink);border-radius:8px;outline:none}
.controls input[type=search]:focus{border-color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px 14px}
.chip{font:inherit;font-size:14px;padding:2px 0;border:0;background:none;color:var(--muted);cursor:pointer}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:4px}
.count{font-size:14px;color:var(--muted);margin-left:auto}

/* tree */
details.topic{border-top:1px solid var(--rule)}
details.topic>summary{cursor:pointer;list-style:none;padding:14px 0;display:flex;gap:12px;align-items:baseline}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary::before{content:"+";color:var(--muted);width:12px}
details.topic[open]>summary::before{content:"\2212"}
.topic-name{font-size:1.1rem;font-weight:600}
.topic-meta{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.section{margin:0 0 20px;padding-left:24px}
.section>h3{font-size:15px;font-weight:600;color:var(--muted);margin:16px 0 4px}
.sub>h4{font-size:14px;font-weight:500;color:var(--muted);margin:12px 0 4px}
.item{padding:9px 0;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item.hidden{display:none}
.item[data-kind="note"] .item-name,.item[data-kind="link"] .item-name{color:var(--muted)}
.item[data-kind="note"] .dot{opacity:.35}
.item-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:99px;background:var(--rule);flex:0 0 auto;translate:0 -2px}
.dot.done{background:var(--done)}
.dot.skip{background:transparent;border:1px solid var(--rule)}
.item-name{flex:1 1 260px}
.item-name mark{background:#ffe58f;color:#1d1d1f;border-radius:2px}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.pill{font:inherit;font-size:14px;padding:0;border:0;background:none;color:var(--muted);white-space:nowrap;cursor:pointer}
.pill:hover{color:var(--ink)}
.pill.primary,.pill.note-page{color:var(--accent)}
.pill.status{min-width:78px;text-align:left}
.pill.status[data-status="Done"]{color:var(--done);font-weight:600}
.pill.status[data-status="In progress"],.pill.status[data-status="Revisit"]{color:var(--signal)}
#sync{font-size:13px;color:var(--muted)}
#sync.warn{color:var(--signal)}
.meta{font-size:13px;color:var(--muted);white-space:nowrap}
.item-name .meta{white-space:normal}
.note{margin:8px 0 4px 17px;padding-left:14px;border-left:2px solid var(--rule);font-size:15px;color:var(--ink);max-width:70ch}
.note[hidden]{display:none}
.empty{padding:40px 0;color:var(--muted)}
footer{margin-top:48px;font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
footer a{color:var(--muted)}
@media (max-width:640px){.topic-meta{margin-left:0;width:100%;padding-left:24px}.section{padding-left:0}}
</style>
</head>
<body>
<div class="wrap">
<header class="mast">
  <a class="crumb" href="../">Notes</a>
  <h1>Roadmap</h1>
  <div class="bars" id="bars"></div>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="Search   /" aria-label="Search">
  <div class="chips" id="filters"></div>
  <span class="count" id="count"></span>
</div>

<main id="tree"><p class="empty">Loading…</p></main>

<footer>
  <span id="src"></span>
  <span id="sync"></span>
  <a href="../">Notes</a>
  <a id="sheet" hidden>Open the sheet</a>
</footer>
</div>

<script src="../assets/gate.js"></script>
<script>
try { localStorage.removeItem('aen-theme'); } catch (e) {}   // theme follows the system setting

(function () {
  var tree = document.getElementById('tree'), qbox = document.getElementById('q'),
      countEl = document.getElementById('count'), filterBox = document.getElementById('filters');
  var FILTERS = [
    ['todo', 'To do', function (i) { return i.status !== 'Done' && i.status !== 'Skipped'; }],
    ['done', 'Done', function (i) { return i.status === 'Done'; }],
    ['video', 'Video', function (i) { return i.resource && i.resource.type === 'video'; }],
    ['read', 'Read', function (i) { return i.resource && i.resource.type !== 'video' && i.resource.type !== 'note'; }],
    ['note', 'Has note', function (i) { return !!i.note; }],
    ['also', 'Second source', function (i) { return !!i.also; }]
  ];
  var active = {}, items = [], notesByKey = {};

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }


  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

  // A cell in the sheet could hold javascript: or data: — only let http(s) through.
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; }

  // A note page exists for some sections; its sections follow the item order.
  function notePage(topicName, sectionNumber, indexInSection) {
    var key = slug(topicName) + '#' + sectionNumber;
    var path = notesByKey[key];
    return path ? '../' + path + '/#s' + (indexInSection + 1) : null;
  }

  function itemHTML(item, trackName, topicName, sectionNumber, idx) {
    var cls = item.status === 'Done' ? ' done' : item.status === 'Skipped' ? ' skip' : '';
    var links = '';
    var url = item.resource && safeUrl(item.resource.url), also = safeUrl(item.also);
    if (url) {
      var label = item.resource.type === 'video' ? 'Watch' : 'Read';
      links += '<a class="pill primary" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" title="' +
        esc(item.resource.label || '') + '">' + label + '</a>';
    }
    if (also) links += '<a class="pill" href="' + esc(also) + '" target="_blank" rel="noopener noreferrer">Also</a>';
    var np = item.kind === 'item' ? notePage(topicName, sectionNumber, idx) : null;
    if (np) links += '<a class="pill note-page" href="' + np + '">Note page</a>';
    if (item.note) links += '<button class="pill note-btn" type="button" aria-expanded="false">Note</button>';
    if (item.kind === 'item') {
      var st = item.status || 'Not started';
      links = '<button class="pill status" type="button" data-status="' + esc(st) + '" ' +
        'title="Click to change status">' + esc(st === 'Not started' ? 'To do' : st) + '</button>' + links;
    }

    var meta = [];
    if (item.hours) meta.push(item.hours + ' h');
    if (item.target) meta.push(item.target);

    var key = slug(trackName) + '-' + item.row;
    return '<div class="item" data-kind="' + item.kind + '" data-key="' + key + '" id="row-' + key + '">' +
      '<div class="item-top"><span class="dot' + cls + '"></span>' +
      '<span class="item-name">' + esc(item.name) +
      (item.resource && item.resource.label ? '<br><span class="meta">' + esc(item.resource.label) + '</span>' : '') +
      '</span>' +
      '<span class="links">' + links + '</span>' +
      '<span class="meta">' + meta.join(' · ') + '</span></div>' +
      (item.note ? '<div class="note" hidden>' + esc(item.note) + '</div>' : '') +
      '</div>';
  }

  function render(data) {
    var html = '', bars = '';
    data.tracks.forEach(function (track) {
      var all = [], done = 0;
      track.topics.forEach(function (t) {
        t.sections.forEach(function (s) {
          (s.items || []).concat((s.subsections || []).reduce(function (a, x) { return a.concat(x.items); }, []))
            .forEach(function (i) { if (i.kind === 'item') { all.push(i); if (i.status === 'Done') done++; } });
        });
      });
      var pct = all.length ? Math.round(done / all.length * 100) : 0;
      bars += '<div class="bar" data-bar="' + slug(track.name) + '"><div class="lab"><span>' + esc(track.name) + '</span>' +
        '<span class="bar-count"><b>' + done + '</b> / ' + all.length + ' · ' + pct + '%</span></div>' +
        '<div class="track-bar"><i style="width:' + pct + '%"></i></div></div>';

      html += '<section class="track" data-track="' + slug(track.name) + '" data-name="' + esc(track.name) + '">' +
        '<h2 style="font-size:.9rem;font-weight:600;color:var(--muted);margin:32px 0 4px">' + esc(track.name) + '</h2>';
      track.topics.forEach(function (topic) {
        var tItems = 0, tDone = 0, dates = [];
        topic.sections.forEach(function (s) {
          (s.items || []).forEach(function (i) { if (i.kind === 'item') { tItems++; if (i.status === 'Done') tDone++; if (i.target) dates.push(i.target); } });
          (s.subsections || []).forEach(function (sub) {
            sub.items.forEach(function (i) { if (i.kind === 'item') { tItems++; if (i.status === 'Done') tDone++; if (i.target) dates.push(i.target); } });
          });
        });
        dates.sort();
        html += '<details class="topic"><summary><span class="topic-name">' + esc(topic.name) + '</span>' +
          '<span class="topic-meta">' + tDone + ' / ' + tItems +
          (dates.length ? ' · ' + dates[0] + ' → ' + dates[dates.length - 1] : '') + '</span></summary>';
        topic.sections.forEach(function (section, si) {
          html += '<div class="section"><h3>' + esc(section.name) + '</h3>';
          var n = 0;
          (section.items || []).forEach(function (i) { html += itemHTML(i, track.name, topic.name, si + 1, n); if (i.kind === 'item') n++; });
          (section.subsections || []).forEach(function (sub) {
            html += '<div class="sub"><h4>' + esc(sub.name) + '</h4>';
            sub.items.forEach(function (i) { html += itemHTML(i, track.name, topic.name, si + 1, n); if (i.kind === 'item') n++; });
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</details>';
      });
      html += '</section>';
    });
    document.getElementById('bars').innerHTML = bars;
    tree.innerHTML = html;
    items = [].slice.call(tree.querySelectorAll('.item'));
  }

  function matches(el, needle) {
    if (needle && el.textContent.toLowerCase().indexOf(needle) < 0) return false;
    var keys = Object.keys(active).filter(function (k) { return active[k]; });
    if (!keys.length) return true;
    var data = el.__item;
    if (!data) return false;
    return keys.every(function (k) {
      var f = FILTERS.filter(function (x) { return x[0] === k; })[0];
      return f && f[2](data);
    });
  }

  function apply() {
    var needle = qbox.value.trim().toLowerCase(), shown = 0;
    items.forEach(function (el) {
      var ok = matches(el, needle);
      el.classList.toggle('hidden', !ok);
      if (ok) shown++;
    });
    // open every topic that still has something in it, close the rest
    [].forEach.call(tree.querySelectorAll('details.topic'), function (d) {
      var any = d.querySelector('.item:not(.hidden)');
      if (needle || Object.keys(active).some(function (k) { return active[k]; })) d.open = !!any;
      d.style.display = any ? '' : 'none';
    });
    countEl.textContent = shown + ' of ' + items.length + ' rows';
  }

  FILTERS.forEach(function (f) {
    var b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = f[1]; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      active[f[0]] = !active[f[0]];
      b.setAttribute('aria-pressed', active[f[0]] ? 'true' : 'false');
      apply();
    });
    filterBox.appendChild(b);
  });

  qbox.addEventListener('input', apply);
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== qbox) { e.preventDefault(); qbox.focus(); }
    if (e.key === 'Escape' && document.activeElement === qbox) { qbox.value = ''; apply(); qbox.blur(); }
  });
  tree.addEventListener('click', function (e) {
    var btn = e.target.closest('.note-btn');
    if (!btn) return;
    var note = btn.closest('.item').querySelector('.note');
    var open = note.hasAttribute('hidden');
    note.toggleAttribute('hidden', !open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // ---------- progress: kept in the browser, and in the sheet when it is wired up
  var STATUSES = ['Not started', 'In progress', 'Done', 'Revisit', 'Skipped'];   // the sheet's dropdown, in order
  var STORE = 'aen-progress', config = null, queue = [], syncEl = document.getElementById('sync');

  function local() {
    try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; }
  }
  function saveLocal(map) {
    try { localStorage.setItem(STORE, JSON.stringify(map)); } catch (e) {}
  }
  // The sheet key is a random token set in the Apps Script. It is never
  // committed: you paste it once and it stays in this browser.
  var KEYSTORE = 'aen-sheet-key';
  function token() {
    if (config && config.token) return config.token;
    try { return sessionStorage.getItem(KEYSTORE) || localStorage.getItem(KEYSTORE) || ''; }
    catch (e) { return ''; }
  }
  function askForKey() {
    var entered = window.prompt('Sheet key (from the Apps Script). Leave empty to keep progress in this browser only.');
    if (!entered) return '';
    try { localStorage.setItem(KEYSTORE, entered.trim()); } catch (e) {}
    return entered.trim();
  }

  function say(text, warn) {
    if (!syncEl) return;
    syncEl.textContent = text;
    syncEl.classList.toggle('warn', !!warn);
  }

  function paint(el) {
    var item = el.__item, st = item.status || 'Not started';
    var btn = el.querySelector('.status'), dot = el.querySelector('.dot');
    if (btn) {
      btn.dataset.status = st;
      btn.textContent = st === 'Not started' ? 'To do' : st;
    }
    dot.className = 'dot' + (st === 'Done' ? ' done' : st === 'Skipped' ? ' skip' : '');
  }

  function refreshCounts() {
    [].forEach.call(document.querySelectorAll('section.track'), function (sec) {
      var rows = sec.querySelectorAll('.item[data-kind="item"]');
      var done = sec.querySelectorAll('.item[data-kind="item"] .status[data-status="Done"]').length;
      var pct = rows.length ? Math.round(done / rows.length * 100) : 0;
      var bar = document.querySelector('.bar[data-bar="' + sec.dataset.track + '"]');
      if (bar) {
        bar.querySelector('.bar-count').innerHTML = '<b>' + done + '</b> / ' + rows.length + ' · ' + pct + '%';
        bar.querySelector('.track-bar i').style.width = pct + '%';
      }
      [].forEach.call(sec.querySelectorAll('details.topic'), function (d) {
        var all = d.querySelectorAll('.item[data-kind="item"]').length;
        var ok = d.querySelectorAll('.item[data-kind="item"] .status[data-status="Done"]').length;
        var meta = d.querySelector('.topic-meta');
        meta.textContent = meta.textContent.replace(/^\s*\d+ \/ \d+/, ok + ' / ' + all);
      });
    });
  }

  function push() {
    if (!config || !config.webapp_url || !queue.length) return;
    var batch = queue.splice(0, queue.length);
    say('saving to the sheet…');
    fetch(config.webapp_url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // keeps the browser from sending a preflight
      body: JSON.stringify({ token: token(), updates: batch })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.error) throw new Error(res.error);
      say('saved to the sheet · ' + new Date().toLocaleTimeString());
    }).catch(function (err) {
      queue = batch.concat(queue);
      say('kept in this browser only (' + err.message + ')', true);
    });
  }

  function setStatus(el, status) {
    var item = el.__item;
    item.status = status;
    paint(el);
    refreshCounts();
    var map = local();
    map[el.dataset.key] = status;
    saveLocal(map);
    queue.push({ sheet: el.closest('section.track').dataset.name, row: item.row, status: status });
    push();
  }

  tree.addEventListener('click', function (e) {
    var btn = e.target.closest('.status');
    if (!btn) return;
    var el = btn.closest('.item');
    var next = STATUSES[(STATUSES.indexOf(el.__item.status || 'Not started') + 1) % STATUSES.length];
    setStatus(el, next);
  });

  Promise.all([
    fetch('../data/roadmap.json').then(function (r) { return r.json(); }),
    fetch('../data/notes.json').then(function (r) { return r.json(); }).catch(function () { return { notes: [] }; }),
    fetch('../data/sheet.json').then(function (r) { return r.json(); }).catch(function () { return {}; })
  ]).then(function (both) {
    config = both[2] || {};
    var data = both[0];
    both[1].notes.forEach(function (n) { notesByKey[n.topic + '#' + n.section] = n.path; });
    render(data);
    // stash the row data on each element for filtering
    var flat = {};
    data.tracks.forEach(function (t) {
      var prefix = slug(t.name) + '-';
      t.topics.forEach(function (tp) { tp.sections.forEach(function (s) {
        (s.items || []).forEach(function (i) { flat[prefix + i.row] = i; });
        (s.subsections || []).forEach(function (sub) { sub.items.forEach(function (i) { flat[prefix + i.row] = i; }); });
      }); });
    });
    items.forEach(function (el) { el.__item = flat[el.dataset.key]; });
    // the browser's own record wins over the exported snapshot
    var stored = local();
    items.forEach(function (el) {
      if (el.__item && stored[el.dataset.key]) { el.__item.status = stored[el.dataset.key]; paint(el); }
    });
    refreshCounts();

    if (config.webapp_url && !token()) askForKey();
    if (config.webapp_url && token()) {
      say('reading the sheet…');
      fetch(config.webapp_url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ token: token(), action: 'read' })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.error) throw new Error(res.error);
          var n = 0;
          items.forEach(function (el) {
            var sheet = el.closest('section.track').dataset.name;
            var st = res.statuses[sheet] && res.statuses[sheet][el.__item.row];
            if (st && st !== el.__item.status) { el.__item.status = st; paint(el); n++; }
          });
          saveLocal({});                     // the sheet is the record now
          refreshCounts();
          say('in step with the sheet · ' + n + ' updated');
        })
        .catch(function (err) {
          if (/bad token/.test(err.message)) { try { localStorage.removeItem(KEYSTORE); } catch (e) {} }
          say('sheet unreachable, using this browser (' + err.message + ')', true);
        });
    } else {
      say('progress saved in this browser only');
    }

    document.getElementById('src').textContent = 'From ' + data.source + ', exported ' + data.generated;
    var sheetUrl = config.sheet_url || data.sheet_url;
    if (sheetUrl) {
      var a = document.getElementById('sheet');
      a.href = safeUrl(sheetUrl); a.target = '_blank'; a.rel = 'noopener noreferrer'; a.hidden = false;
    }
    apply();
    if (location.hash.indexOf('#row-') === 0) {
      var t = document.querySelector(location.hash);
      if (t) { t.closest('details').open = true; t.scrollIntoView({ block: 'center' }); }
    }
  }).catch(function (err) {
    tree.innerHTML = '<p class="empty">Could not load the roadmap data: ' + esc(err.message) + '</p>';
  });
})();
</script>
</body>
</html>
