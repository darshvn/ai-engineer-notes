<svg viewBox="0 0 660 190" role="img" aria-label="A loop: the text so far goes into the model, the model produces a table of tokens with probabilities, one token is picked from that table, it is glued onto the end of the text, and the longer text goes back into the model.">
      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
        </marker>
      </defs>

      <rect x="20" y="46" width="118" height="40" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
      <text x="79" y="70" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="currentColor">text so far</text>

      <line x1="138" y1="66" x2="176" y2="66" stroke="currentColor" stroke-width="1.3" opacity="0.7" marker-end="url(#a1)"/>

      <rect x="180" y="46" width="104" height="40" fill="var(--accent-dim)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="232" y="70" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="var(--accent)">the model</text>

      <line x1="284" y1="66" x2="322" y2="66" stroke="currentColor" stroke-width="1.3" opacity="0.7" marker-end="url(#a1)"/>

      <rect x="326" y="34" width="150" height="64" fill="var(--signal-dim)" stroke="var(--signal)" stroke-width="1.5"/>
      <text x="401" y="54" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="var(--signal)">the table</text>
      <text x="401" y="72" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="var(--signal)">every token,</text>
      <text x="401" y="87" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="var(--signal)">each with a number</text>

      <line x1="476" y1="66" x2="514" y2="66" stroke="currentColor" stroke-width="1.3" opacity="0.7" marker-end="url(#a1)"/>

      <rect x="518" y="46" width="122" height="40" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
      <text x="579" y="70" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="currentColor">pick one row</text>

      <path d="M 579 86 L 579 138 L 79 138 L 79 90" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.7" marker-end="url(#a1)"/>
      <text x="330" y="132" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="currentColor" opacity="0.7">glue it on the end, run the whole thing again</text>

      <text x="330" y="174" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="currentColor" opacity="0.55">one loop = one token</text>
    </svg>