<svg viewBox="0 0 660 178" role="img" aria-label="Top row: a question goes through one pass to an answer, one unit of computation. Bottom row: the same question goes through four passes, each writing an intermediate result that feeds into the next, giving four units of computation before the answer.">
      <defs>
        <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
        </marker>
        <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--signal)"/>
        </marker>
      </defs>

      <text x="20" y="20" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1.2" fill="currentColor" opacity="0.55">STRAIGHT TO THE ANSWER</text>
      <rect x="20" y="32" width="86" height="32" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
      <text x="63" y="53" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="currentColor">17 × 24</text>
      <line x1="106" y1="48" x2="140" y2="48" stroke="currentColor" stroke-width="1.3" opacity="0.7" marker-end="url(#b1)"/>
      <rect x="144" y="32" width="76" height="32" fill="var(--accent-dim)" stroke="var(--accent)" stroke-width="1.4"/>
      <text x="182" y="53" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="var(--accent)">1 pass</text>
      <line x1="220" y1="48" x2="254" y2="48" stroke="currentColor" stroke-width="1.3" opacity="0.7" marker-end="url(#b1)"/>
      <rect x="258" y="32" width="76" height="32" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
      <text x="296" y="53" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="currentColor">answer</text>
      <text x="356" y="53" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="currentColor" opacity="0.6">one unit of computation, total</text>

      <line x1="20" y1="84" x2="640" y2="84" stroke="currentColor" stroke-width="1" opacity="0.18"/>

      <text x="20" y="108" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1.2" fill="var(--signal)">WRITING THE STEPS</text>
      <rect x="20" y="120" width="86" height="32" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
      <text x="63" y="141" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="currentColor">17 × 24</text>

      <line x1="106" y1="136" x2="130" y2="136" stroke="var(--signal)" stroke-width="1.3" marker-end="url(#b2)"/>
      <rect x="134" y="120" width="88" height="32" fill="var(--signal-dim)" stroke="var(--signal)" stroke-width="1.4"/>
      <text x="178" y="141" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="var(--signal)">"= 340"</text>

      <line x1="222" y1="136" x2="246" y2="136" stroke="var(--signal)" stroke-width="1.3" marker-end="url(#b2)"/>
      <rect x="250" y="120" width="88" height="32" fill="var(--signal-dim)" stroke="var(--signal)" stroke-width="1.4"/>
      <text x="294" y="141" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="var(--signal)">"+ 68"</text>

      <line x1="338" y1="136" x2="362" y2="136" stroke="var(--signal)" stroke-width="1.3" marker-end="url(#b2)"/>
      <rect x="366" y="120" width="88" height="32" fill="var(--signal-dim)" stroke="var(--signal)" stroke-width="1.4"/>
      <text x="410" y="141" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="var(--signal)">"= 408"</text>

      <line x1="454" y1="136" x2="478" y2="136" stroke="currentColor" stroke-width="1.3" opacity="0.7" marker-end="url(#b1)"/>
      <rect x="482" y="120" width="76" height="32" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
      <text x="520" y="141" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="currentColor">answer</text>

      <text x="578" y="141" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="var(--signal)">3 units</text>
    </svg>